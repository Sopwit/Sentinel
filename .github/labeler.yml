'component: core':
  - changed-files:
      - any-glob-to-any-file: 'core/**/*'

'component: ui':
  - changed-files:
      - any-glob-to-any-file: 'apps/sentinel-desktop/**/*'
      - any-glob-to-any-file: 'ui/**/*'

'component: packaging':
  - changed-files:
      - any-glob-to-any-file: 'packaging/**/*'

'component: plugins':
  - changed-files:
      - any-glob-to-any-file: 'plugins/**/*'

'component: integrations':
  - changed-files:
      - any-glob-to-any-file: 'integrations/**/*'

'component: tests':
