name: Feature Request
description: Suggest an idea or feature enhancement for Sentinel
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement for Sentinel. Please consider its local-first and privacy-oriented design.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed Behavior
      description: Describe the outcome Sentinel should provide.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Affected Component
      options:
        - UI / QML Presentation
        - Core Engine / C++
        - Local Provider / Ollama Integration
        - Memory / Persistence
        - Platform Integration (Fedora / KDE / Windows / macOS)
        - Packaging & CI/CD
    validations:
      required: true
  - type: textarea
    id: security_privacy
    attributes:
      label: Security / privacy implications
      description: Does this add network access, model/provider access, tools, permissions, background work, or sensitive data handling?
      placeholder: None known, or describe the implications and mitigations.
    validations:
      required: false
