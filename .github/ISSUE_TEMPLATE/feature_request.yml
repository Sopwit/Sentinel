name: Feature Request
description: Suggest an idea or feature enhancement for Sentinel
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement or new feature for Sentinel Desktop Companion.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Component Scope
      options:
        - UI / QML Presentation
        - Core Engine / C++
        - Local Provider / Ollama Integration
        - Memory / Persistence
        - Platform Integration (Fedora / KDE / Windows / macOS)
        - Packaging & CI/CD
    validations:
      required: true
