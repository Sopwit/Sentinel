name: Bug Report
description: Create a report to help us reproduce and fix a bug in Sentinel
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include API keys, tokens, passwords, private prompts, or other sensitive data in this report or its logs.
  - type: input
    id: version
    attributes:
      label: Sentinel version
      description: Release version, commit, or build number.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: Fedora 42, macOS 15.4, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64 / x64
        - ARM64 / aarch64
        - Other
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation / package type
      options:
        - AppImage
        - DEB
        - RPM
        - DMG
        - EXE installer
        - MSI
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Fedora KDE Plasma (Primary Target)
        - Linux (Other Distribution)
        - Windows 11 / 10
        - macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Launch Sentinel
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what Sentinel did instead, including any visible error message.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Traces
      description: Paste relevant, redacted logs, Qt debug output, or crash stack traces here. Never include API keys, tokens, passwords, private prompts, or other sensitive data.
      render: shell
    validations:
      required: false
