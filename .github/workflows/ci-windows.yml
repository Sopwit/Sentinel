name: Windows CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-windows:
    name: Build & Test (Windows)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        run: choco install ninja

      - name: Set up Developer Command Prompt
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $devCmd = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd.exe /c "call `"$devCmd`" && set" | ForEach-Object {
              if ($_ -match "^(INCLUDE|LIB|LIBPATH|WindowsSDK.*|UniversalCRTSdkDir|UCRTVersion|VCTools.*|VCINSTALLDIR|VSINSTALLDIR|ExtensionSdkDir|Framework.*|NETFXSDKDir)=") {
                  $v = $_.Split("=", 2)
                  echo "$($v[0])=$($v[1])" >> $env:GITHUB_ENV
              }
              if ($_ -match "^Path=(.*)" -or $_ -match "^PATH=(.*)") {
                  $paths = $Matches[1].Split(";")
                  foreach ($p in $paths) {
                      if ($p -and (Test-Path $p)) {
                          echo $p >> $env:GITHUB_PATH
                      }
                  }
              }
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: 'win64_msvc2022_64'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure CMake
        run: cmake --preset tests

      - name: Build
        run: cmake --build --preset tests

      - name: QML Lint Check
        shell: pwsh
        run: |
          Get-ChildItem -Path ui/qml -Recurse -Filter *.qml | ForEach-Object { qmllint -I ui/qml $_.FullName }

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset tests

  build-test-windows-arm64:
    name: Build & Test (Windows ARM64)
    runs-on: windows-2022
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        run: choco install ninja

      - name: Set up ARM64 Developer Command Prompt
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $devCmd = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsamd64_arm64.bat"
          cmd.exe /c "call `"$devCmd`" && set" | ForEach-Object {
              if ($_ -match "^(INCLUDE|LIB|LIBPATH|WindowsSDK.*|UniversalCRTSdkDir|UCRTVersion|VCTools.*|VCINSTALLDIR|VSINSTALLDIR|ExtensionSdkDir|Framework.*|NETFXSDKDir)=") {
                  $v = $_.Split("=", 2)
                  echo "$($v[0])=$($v[1])" >> $env:GITHUB_ENV
              }
              if ($_ -match "^Path=(.*)" -or $_ -match "^PATH=(.*)") {
                  $paths = $Matches[1].Split(";")
                  foreach ($p in $paths) {
                      if ($p -and (Test-Path $p)) {
                          echo $p >> $env:GITHUB_PATH
                      }
                  }
              }
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_arm64'
          cache: true

      - name: Configure CMake
        run: cmake --preset windows-arm64

      - name: Build
        run: cmake --build --preset windows-arm64

