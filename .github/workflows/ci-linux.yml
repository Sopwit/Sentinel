name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgl1-mesa-dev libvulkan-dev fonts-noto-core desktop-file-utils appstream-util

      - name: Validate Desktop Entry & AppStream Metadata
        run: |
          desktop-file-validate packaging/linux/dev.sentinel.Sentinel.desktop
          appstream-util validate-relax --nonet packaging/linux/dev.sentinel.Sentinel.metainfo.xml

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: cmake --preset tests

      - name: Build
        run: cmake --build --preset tests

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset tests

      - name: QML Lint Check
        run: |
          find ui/qml -name "*.qml" -print0 | xargs -0 qmllint --Werror

      - name: Format check
        run: |
          pip3 install clang-format==18.1.8
          find apps core tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  asan-build-test:
    name: AddressSanitizer Build & Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgl1-mesa-dev libvulkan-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure with ASan
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: 'detect_leaks=0:halt_on_error=1'
        run: ctest --preset asan --output-on-failure
