name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (macOS)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-sentinel-${{ github.job }}
          max-size: 500M
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake --preset tests
      - name: Build
        run: cmake --build --preset tests
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset tests --output-on-failure
