name: macOS CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Format Check (Fail-Fast)
        run: |
          pip3 install --break-system-packages clang-format==18.1.8 || pip3 install clang-format==18.1.8
          find apps core tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-sentinel-${{ github.job }}
          max-size: 500M

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: 'clang_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure CMake
        run: cmake --preset tests

      - name: Build
        run: cmake --build --preset tests

      - name: QML Lint Check
        run: |
          find ui/qml -name "*.qml" -print0 | xargs -0 qmllint -I ui/qml || true

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset tests

