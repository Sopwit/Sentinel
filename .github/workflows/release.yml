name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Releases must never be cancelled halfway through signing or publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Package Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgl1-mesa-dev libvulkan-dev fonts-noto-core rpm wget
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Configure, build, and install
        run: |
          set -euo pipefail
          cmake --preset package-ready
          cmake --build --preset package-ready
          cmake --install build/package-ready --prefix "$GITHUB_WORKSPACE/dist"
      - name: Create Linux packages
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cpack --config build/package-ready/CPackConfig.cmake
          tar -C dist -czf "artifacts/Sentinel-Desktop-Linux.tar.gz" .
          cp build/package-ready/*.deb artifacts/
          cp build/package-ready/*.rpm artifacts/
      - name: Create AppImage
        run: |
          set -euo pipefail
          # Upstream does not publish signed release checksums for these assets. Pinning
          # named releases removes the previous mutable continuous endpoint.
          wget --https-only --no-verbose -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget --https-only --no-verbose -O linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir dist \
            -e dist/bin/sentinel-desktop \
            -d dist/share/applications/dev.sentinel.Sentinel.desktop \
            -i dist/share/icons/hicolor/scalable/apps/dev.sentinel.Sentinel.svg \
            --plugin qt --output appimage
          appimage=$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          mv "$appimage" artifacts/Sentinel-Desktop-Linux.AppImage
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: artifacts/
          if-no-files-found: error

  macos:
    name: Package macOS
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Configure, build, and install
        run: |
          set -euo pipefail
          cmake --preset package-ready
          cmake --build --preset package-ready
          cmake --install build/package-ready --prefix "$GITHUB_WORKSPACE/dist"
      - name: Bundle, sign, and package
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_CERT_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_CERT_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          app='dist/Sentinel Desktop.app'
          mv dist/sentinel-desktop.app "$app"
          signing_identity='-'
          if [ -n "${APPLE_CERT_BASE64:-}" ]; then
            keychain="$RUNNER_TEMP/build.keychain"
            keychain_password=$(openssl rand -base64 24)
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            cert="$RUNNER_TEMP/cert.p12"
            printf '%s' "$APPLE_CERT_BASE64" | base64 --decode > "$cert"
            security import "$cert" -k "$keychain" -P "$APPLE_CERT_PASS" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
            signing_identity=$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ { print $2; exit }')
            test -n "$signing_identity"
          fi
          macdeployqt "$app" -qmldir=ui/qml -codesign="$signing_identity"
          if [ "$signing_identity" != '-' ]; then
            codesign --force --deep --options runtime --entitlements resources/platform/macos/sentinel.entitlements --sign "$signing_identity" "$app"
          fi
          brew install create-dmg
          mkdir artifacts
          create-dmg --volname 'Sentinel Desktop Installer' --window-pos 200 120 --window-size 600 300 --icon-size 100 --icon 'Sentinel Desktop.app' 175 120 --hide-extension 'Sentinel Desktop.app' --app-drop-link 425 120 artifacts/Sentinel-Desktop-macOS.dmg dist/
          chmod +x packaging/macos/build_pkg.sh
          ./packaging/macos/build_pkg.sh "$app" artifacts/Sentinel-Desktop-macOS.pkg ''
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASS:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit artifacts/Sentinel-Desktop-macOS.dmg --apple-id "$APPLE_ID" --password "$APPLE_APP_PASS" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple artifacts/Sentinel-Desktop-macOS.dmg
          fi
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd artifacts && shasum -a 256 * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: artifacts/
          if-no-files-found: error

  windows:
    name: Package Windows
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja and WiX
        shell: pwsh
        run: choco install ninja wixtoolset --no-progress --yes
      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure, build, and install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset package-ready
          cmake --build --preset package-ready
          cmake --install build/package-ready --prefix "$env:GITHUB_WORKSPACE\dist"
      - name: Bundle and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          windeployqt --qmldir ui/qml dist/sentinel-desktop.exe
          Compress-Archive -Path dist/* -DestinationPath artifacts/Sentinel-Desktop-Windows-x64.zip
          cpack --config build/package-ready/CPackConfig.cmake
          $exe = Get-ChildItem build/package-ready -Filter '*.exe' | Select-Object -First 1
          $msi = Get-ChildItem build/package-ready -Filter '*.msi' | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $msi) { throw 'CPack did not produce both EXE and MSI installers.' }
          Copy-Item $exe.FullName artifacts/Sentinel-Desktop-Windows-x64.exe
          Copy-Item $msi.FullName artifacts/Sentinel-Desktop-Windows-x64.msi
      - name: Sign Windows binaries when configured
        if: ${{ secrets.WIN_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_BASE64))
          & signtool sign /fd SHA256 /f $certPath /p $env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist/sentinel-desktop.exe
          Get-ChildItem artifacts -Include '*.exe', '*.msi' -Recurse | ForEach-Object { & signtool sign /fd SHA256 /f $certPath /p $env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
      - name: Generate checksums
        shell: pwsh
        run: Get-FileHash artifacts/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir final-artifacts
          find release-artifacts -type f -exec cp {} final-artifacts/ \;
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: final-artifacts/*
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-pre') }}
